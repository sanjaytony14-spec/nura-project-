<VirtualHost *:80>
    DocumentRoot /var/www/html
    # Only the explicit production proxy may supply the real client IP.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 172.30.82.10
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>
    <FilesMatch "^(bootstrap|config)\.php$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
